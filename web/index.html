<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Civil Colony Maintenance Portal — NCL</title>
    <script>
      // apply the saved theme before first paint, so dark mode never flashes light
      try { var t = localStorage.getItem('cp-theme'); if (t) document.documentElement.dataset.theme = t;
        var c = localStorage.getItem('cp-scheme'); if (c && c !== 'teal') document.documentElement.dataset.scheme = c; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
